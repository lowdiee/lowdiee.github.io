function Cover({v,index=0}){let palettes=[['#c7e8b0','#7290c1'],['#ffd8aa','#cf8aa9'],['#bfbcf2','#717fc7'],['#bce7ef','#63abb6'],['#f5e1a9','#e5a273']];let p=palettes[index%palettes.length];return v?.thumbnail?<img src={v.thumbnail} loading="lazy" alt={v.title||'Miniatura filmu'} onError={e=>{e.currentTarget.style.opacity=0}}/>:<div style={{height:'100%',width:'100%',background:`linear-gradient(135deg,${p[0]},${p[1]})`,display:'grid',placeItems:'center',fontSize:36,color:'#fff8',fontWeight:800}}>▶</div>}
function Spark(){return <svg className="wave" viewBox="0 0 280 42" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sp" x1="0" x2="0" y1="0" y2="1"><stop stopColor="#a8e678" stopOpacity=".2"/><stop offset="1" stopColor="#a8e678" stopOpacity="0"/></linearGradient></defs><path fill="url(#sp)" d="M0 31 Q18 27 30 33T65 22T105 24T143 14T181 19T217 9T280 5V42H0Z"/><path d="M0 31 Q18 27 30 33T65 22T105 24T143 14T181 19T217 9T280 5" fill="none" stroke="#9ad473" strokeWidth="2.4" strokeLinecap="round"/></svg>}
function App(){const[theme,setTheme]=useState(()=>{try{return localStorage.getItem('ld-redesign-theme')||'light'}catch{return 'light'}}),[sound,setSound]=useState(()=>{try{return localStorage.getItem('ld-redesign-sound')==='true'}catch{return false}}),[data,setData]=useState(window.__DEMO__?demo:null),[error,setError]=useState(''),[loading,setLoading]=useState(!window.__DEMO__),[sort,setSort]=useState('views'),[search,setSearch]=useState(''),[limit,setLimit]=useState(7),[metric,setMetric]=useState('views');const audio=useRef(null);useEffect(()=>{document.documentElement.dataset.theme=theme;try{localStorage.setItem('ld-redesign-theme',theme)}catch{}},[theme]);useEffect(()=>{try{localStorage.setItem('ld-redesign-sound',String(sound))}catch{}},[sound]);const click=()=>{if(sound&&audio.current){audio.current.currentTime=0;audio.current.volume=.24;audio.current.play().catch(()=>{})}};
async function load(){if(window.__DEMO__){setData(demo);return}setLoading(true);setError('');try{const r=await fetch('/api/youtube',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const result=await r.json();if(!result?.channel?.statistics||!Array.isArray(result.videos))throw Error('Nieprawidłowy format odpowiedzi');setData(result)}catch(e){setError('Nie udało się pobrać statystyk z /api/youtube ('+e.message+').')}finally{setLoading(false)}}useEffect(()=>{load()},[]);
const videos=(data?.videos||[]).map((v,i)=>({...v,id:v.id||v.videoId||'',title:v.title||'Bez tytułu',views:n(v.views),likes:n(v.likes),comments:n(v.comments),idx:i}));const ranked=[...videos].sort((a,b)=>b.views-a.views),best=ranked[0],total=videos.reduce((s,v)=>s+v.views,0),likes=videos.reduce((s,v)=>s+v.likes,0),sub=n(data?.channel?.statistics?.subscriberCount),channelviews=n(data?.channel?.statistics?.viewCount),milestone=100000,progress=Math.min(100,sub/milestone*100);const rows=[...videos].filter(v=>v.title.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b[sort]-a[sort]);const graph=[...videos].sort((a,b)=>b[metric]-a[metric]).slice(0,10);const maxGraph=Math.max(1,...graph.map(v=>v[metric]));const viewsLike=total?100*likes/total:0;
function navTo(id){click();document.querySelector(id)?.scrollIntoView({behavior:'smooth'})}
return <div className="app"><audio ref={audio} src="./CLICK.wav" preload="auto"/><aside className="sidebar"><nav><div className="navtitle">WORKSPACE</div><button className="navitem active" onClick={()=>navTo('#home')}><Icon name="grid"/><span>Przegląd</span></button><button className="navitem" onClick={()=>navTo('#performance')}><Icon name="chart"/><span>Wyniki</span></button><button className="navitem" onClick={()=>navTo('#library')}><Icon name="play"/><span>Biblioteka Shorts</span></button></nav><div className="sidebottom"><div className="profile"><div className="avatar">{data?.channel?.snippet?.thumbnails?.high?.url||data?.channel?.snippet?.thumbnails?.medium?.url||data?.channel?.snippet?.thumbnails?.default?.url?<img src={data.channel.snippet.thumbnails.high?.url||data.channel.snippet.thumbnails.medium?.url||data.channel.snippet.thumbnails.default?.url} alt="Zdjęcie profilowe kanału LOWDIEE" referrerPolicy="no-referrer" onError={e=>{e.currentTarget.style.display="none";e.currentTarget.parentElement.textContent="L"}}/>:"L"}</div><div><strong>{data?.channel?.snippet?.title||"LOWDIEE"}</strong><small>YouTube Creator</small></div></div></div></aside>
<main className="main" id="home"><header className="topbar"><div className="breadcrumb">Workspace / <strong>Przegląd kanału</strong></div><div className="actions"><div className="live"><span className="led"/>{window.__DEMO__?'TRYB DEMO':loading?'ŁĄCZENIE':'DANE YOUTUBE'}</div><button className="iconbutton" aria-label="Odśwież dane" title="Odśwież" onClick={()=>{click();load()}}><Icon name="refresh"/></button><button className="iconbutton" aria-label="Włącz lub wyłącz dźwięki" title="Dźwięki" onClick={()=>{setSound(s=>!s);if(!sound&&audio.current){audio.current.volume=.24;audio.current.play().catch(()=>{})}}}><Icon name={sound?'sound':'mute'}/></button><button className="iconbutton" aria-label="Zmień motyw" title="Zmień motyw" onClick={()=>{click();setTheme(theme==='dark'?'light':'dark')}}><Icon name={theme==='dark'?'sun':'moon'}/></button></div></header>
<section className="intro enter"><div><div className="kicker">YOUR CREATOR SPACE / 2026</div><h1>Wszystko rośnie.<br/><i>Widzisz to tutaj.</i></h1><p>Twoje wyniki. Bez szumu, bez zgadywania. Tylko to, co ważne.</p></div><div className="datepill">{new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'})}</div></section>
{window.__DEMO__&&<div className="error">To wersja demonstracyjna. Wszystkie liczby i tytuły są przykładowe — plik produkcyjny pobiera rzeczywiste dane z Twojego API.</div>}{error&&<div className="error">{error}<button onClick={load}>Ponów</button></div>}
<div className="dashboard"><section className="spotlight enter" style={{animationDelay:'.08s'}}><div className="spothead"><div><div className="overline">THE ROAD TO 100K</div><div className="spotlabel">Twoja społeczność</div></div><span className="arrowcircle"><Icon name="arrow"/></span></div><div><div className="spotvalue">{loading?'—':full(sub)}</div><div className="spotlabel">subskrybentów na kanale LOWDIEE</div></div><div className="spotfoot"><div className="progressinfo"><div><span>POSTĘP DO 100 000</span><span>{progress.toFixed(1).replace('.',',')}%</span></div><div className="progressbar"><div style={{width:progress+'%'}}/></div></div><div className="milestone">Do następnego celu<strong>{loading?'—':full(Math.max(0,milestone-sub))}</strong></div></div></section>
<div className="overview enter" style={{animationDelay:'.16s'}}><div className="minicard big"><div className="minihead"><span>Łączne wyświetlenia</span><Icon name="eye"/></div><div><div className="minivalue">{loading?'—':short(channelviews)}</div><div className="subline">Wszystkie wyświetlenia kanału</div><Spark/></div></div><div className="minicard"><div className="minihead"><span>Najlepszy Short</span><Icon name="play"/></div><div><div className="minivalue">{loading?'—':short(best?.views)}</div><div className="subline">Z pobranych filmów</div></div></div><div className="minicard"><div className="minihead"><span>Like rate</span><Icon name="heart"/></div><div><div className="minivalue">{loading?'—':viewsLike.toFixed(2).replace('.',',')+'%'}</div><div className="subline">Z pobranych filmów</div></div></div></div></div>
<div className="sectionrow" id="performance"><div><h2>W centrum uwagi</h2><p>Co przyciąga widzów do Twoich filmów</p></div><button className="eyebrowlink" onClick={()=>navTo('#library')}>Zobacz wszystkie filmy ↗</button></div><div className="analyticsrow"><section className="panel chartpanel"><div className="paneltop"><div><h3>Najlepsze materiały</h3><p>Ranking na podstawie pobranych Shortsów</p></div><div className="seg"><button className={metric==='views'?'selected':''} onClick={()=>{click();setMetric('views')}}>Views</button><button className={metric==='likes'?'selected':''} onClick={()=>{click();setMetric('likes')}}>Likes</button></div></div><div className="chartnumber">{loading?'—':short(graph.reduce((s,v)=>s+v[metric],0))}</div><div className="chartdesc">Suma wyników TOP 10 · {metric==='views'?'wyświetlenia':'polubienia'}</div><div className="bars" aria-label="Wykres słupkowy dziesięciu najlepszych Shortsów">{graph.map((v,i)=><div className="barcol" key={v.id||i}><div className="baritem" data-top={i<3?'true':'false'} style={{height:Math.max(4,100*v[metric]/maxGraph)+'%'}} tabIndex="0" aria-label={`${v.title}: ${full(v[metric])}`}><span className="bar-tooltip">{full(v[metric])}</span></div></div>)}</div><div className="barlabels">{graph.map((v,i)=><span key={i}>{i+1}</span>)}</div></section>
<section className="panel featurepanel"><span className="featuretag">✦ TOP PERFORMER</span><h3>Short, który wygrał.</h3><a href={best?.id?`https://www.youtube.com/watch?v=${encodeURIComponent(best.id)}`:'#library'} target={best?.id?'_blank':undefined} rel="noopener noreferrer" className="featurethumb" title="Otwórz film" onClick={click}><Cover v={best} index={0}/><span className="play">▶</span></a><div className="featurebottom"><div><div className="featuretitle">{best?.title||'Brak danych o filmie'}</div><div className="featurecount">{loading?'—':short(best?.views)}</div><div className="smallmuted">wyświetleń</div></div><div className="smallmuted">♡ {short(best?.likes)}</div></div></section></div>
<section className="library" id="library"><div className="libraryhead"><div><h2>Twoje Shorts</h2><p>{videos.length} filmów · wszystko w jednym miejscu</p></div><div className="libcontrols"><label className="searchbox"><Icon name="search"/><input value={search} placeholder="Znajdź film..." onChange={e=>{setSearch(e.target.value);setLimit(7)}} aria-label="Szukaj filmu"/></label><select className="sortselect" value={sort} onChange={e=>{click();setSort(e.target.value)}} aria-label="Sortuj filmy"><option value="views">Najwięcej wyświetleń</option><option value="likes">Najwięcej polubień</option><option value="comments">Najwięcej komentarzy</option></select></div></div>
<div className="panel tablepanel"><div className="tableheading"><span>#</span><span>MATERIAŁ</span><span>WYŚWIETLENIA</span><span>POLUBIENIA</span><span>WYNIK</span></div>{rows.slice(0,limit).map((v,i)=><a className="tablerow" key={(v.id||'v')+'-'+i} href={v.id?`https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`:'#library'} target={v.id?'_blank':undefined} rel="noopener noreferrer" onClick={click}><div className="ranknum">{String(i+1).padStart(2,'0')}</div><div className="videocell"><div style={{flex:'none',width:'79px',height:'46px',overflow:'hidden',borderRadius:9}}><Cover v={v} index={v.idx}/></div><div style={{minWidth:0}}><strong>{v.title}</strong><small>Youtube Short ↗</small></div></div><div><div className="cellnum">{short(v.views)}</div><div className="cellsub">views</div></div><div><div className="cellnum">{short(v.likes)}</div><div className="cellsub">likes</div></div><div className="pillbar"><div style={{width:Math.max(2,100*v.views/Math.max(1,best?.views))+'%'}}/></div></a>)}{!rows.length&&<div style={{padding:35,textAlign:'center',fontSize:12,color:'var(--muted)'}}>{loading?'Ładowanie danych…':'Nie znaleziono filmów.'}</div>}</div>{rows.length>limit&&<button className="viewmore" onClick={()=>{click();setLimit(limit+10)}}>Pokaż więcej Shortsów ↓</button>}</section><footer className="footer"><span>© LOWDIEE STUDIO · Stworzone z myślą o twórcach.</span><span>{window.__DEMO__?'Podgląd · przykładowe dane':'Dane: YouTube API · /api/youtube'}</span></footer></main></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
